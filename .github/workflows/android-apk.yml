name: Build Android debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    name: Test, build and package debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json', 'package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else echo "::warning::package-lock.json missing - running npm install. Commit the generated lockfile."; npm install --no-audit --no-fund; fi
      - name: Checks and tests
        run: |
          npm run check
          npm test
      - name: Build web app
        run: npm run build
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          node scripts/android-prepare.mjs
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: knitting-operator-assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
